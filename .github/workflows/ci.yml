name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile povo_api.py povo_worker.py povo_web.py healthcheck.py tools/init_data.py
      - run: python -m unittest discover -s tests -v
      - run: docker compose config
      - run: docker build -t povo-promo-automation:test .
