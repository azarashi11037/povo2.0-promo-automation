name: Finish povo email login

on:
  workflow_dispatch:
    inputs:
      next_due_at:
        description: "Next due time, for example 2026-09-06T16:17:00+09:00"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: povo-session-state
  cancel-in-progress: false

jobs:
  finish-email-login:
    runs-on: ubuntu-latest
    env:
      POVO_BUNDLE_KEY: ${{ secrets.POVO_BUNDLE_KEY }}
      POVO_LOGIN_OTP: ${{ secrets.POVO_LOGIN_OTP }}
      POVO_PROMO_CODE: ${{ secrets.POVO_PROMO_CODE }}
      NEXT_DUE_AT: ${{ inputs.next_due_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Complete login and create encrypted session
        run: |
          set -euo pipefail
          test -s state/login.enc
          private_dir="$RUNNER_TEMP/povo-login"
          install -d -m 700 "$private_dir"
          python tools/login_session.py finish \
            --challenge state/login.enc \
            --data-dir "$private_dir" \
            --output state/session.enc \
            --next-due-at "$NEXT_DUE_AT"
          python povo_api.py \
            --credentials "$private_dir/credentials.xml" \
            --device "$private_dir/device.xml" \
            inspect
      - name: Replace challenge with session ciphertext
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force state/session.enc
          git rm --ignore-unmatch state/login.enc
          git commit -m "Create encrypted povo session from email login"
          git push
